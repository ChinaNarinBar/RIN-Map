<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RIN Map</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "PingFang SC",
        "Helvetica Neue",
        sans-serif;
    background: #fff7fa;
    overflow: hidden;
}


/* ===== 左侧目录 ===== */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 285px;
    height: 100vh;

    background: rgba(255,255,255,.97);

    border-right: 1px solid #f1dce5;

    z-index: 2000;

    overflow-y: auto;

    padding: 28px 20px 25px;
}


.logo {
    font-size: 23px;
    font-weight: 700;
    color: #d9578c;
    margin-bottom: 5px;
}


.logo-credit {
    font-size: 11px;
    color: #b79aa5;
    margin-bottom: 30px;
    letter-spacing: .3px;
}


.menu-title {
    font-size: 11px;
    letter-spacing: 2px;
    color: #b18b99;
    margin-bottom: 15px;
    font-weight: 700;
}


.country-title {
    font-size: 13px;
    font-weight: 700;
    color: #6f555f;
    margin: 18px 0 8px;
}


.city-button {
    width: 100%;
    border: none;
    background: transparent;
    text-align: left;

    padding: 10px 12px;

    border-radius: 10px;

    color: #59454d;

    font-size: 14px;

    font-family: inherit;

    cursor: pointer;
}


.city-button:hover {
    background: #fff0f5;
}


.city-button.active {
    background: #fce3ec;
    color: #c64e7e;
    font-weight: 700;
}


/* ===== 类型 ===== */

.type-list {
    padding-left: 12px;
    display: none;
}


.type-list.show {
    display: block;
}


.type-button {
    width: 100%;
    border: none;
    background: transparent;

    text-align: left;

    padding: 8px 10px;

    border-radius: 8px;

    color: #806a73;

    font-size: 13px;

    font-family: inherit;

    cursor: pointer;
}


.type-button:hover {
    background: #fff5f8;
}


.type-button.active {
    color: #d9578c;
    font-weight: 700;
}


/* ===== 地点 ===== */

.spot-list {
    padding-left: 10px;
    margin-top: 3px;
    margin-bottom: 5px;
}


.spot-button {
    width: 100%;
    border: none;
    background: transparent;

    text-align: left;

    padding: 7px 10px;

    color: #9a7c86;

    font-size: 12px;

    line-height: 1.5;

    font-family: inherit;

    cursor: pointer;
}


.spot-button:hover {
    color: #d9578c;
    background: #fff7fa;
    border-radius: 7px;
}


/* ===== 左侧署名 ===== */

.credit {
    margin-top: 45px;

    padding-top: 18px;

    border-top: 1px solid #f1e4e9;

    font-size: 10px;

    line-height: 1.7;

    color: #b9a3ab;

    letter-spacing: .2px;
}


.credit-name {
    display: inline-block;

    margin-top: 2px;

    color: #d9578c;

    font-size: 12px;

    font-weight: 800;

    letter-spacing: .3px;
}


/* ===== 地图 ===== */

#map {
    position: fixed;

    left: 285px;

    top: 0;

    width: calc(100% - 285px);

    height: 100vh;
}


/* ===== 地图水印 ===== */

.map-watermark {
    position: fixed;

    right: 20px;

    bottom: 20px;

    z-index: 1500;

    background: rgba(255,255,255,.72);

    padding: 6px 11px;

    border-radius: 10px;

    color: #b47d94;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .4px;

    pointer-events: none;
}


/* ===== Popup ===== */

.popup {
    width: 285px;
    padding: 3px 2px;
}


.popup h2 {
    margin: 0 0 9px;

    color: #4b3540;

    font-size: 17px;

    line-height: 1.35;

    font-weight: 700;
}


.subtitle {
    color: #d9578c;

    font-size: 14px;

    font-weight: 600;

    margin-bottom: 4px;
}


.source {
    color: #9b7a87;

    font-size: 11px;

    margin-bottom: 15px;
}


.divider {
    height: 1px;

    background: #f2e3e8;

    margin: 12px 0;
}


.info {
    font-size: 13px;

    color: #5d4c54;

    line-height: 1.7;

    margin: 6px 0;
}


.info strong {
    color: #a94b73;
}


.menu-item {
    margin-left: 18px;

    line-height: 1.7;
}


.popup-credit {
    text-align: right;

    color: #c09eab;

    font-size: 9px;

    margin-top: 12px;

    letter-spacing: .3px;
}


/* ===== 地图按钮 ===== */

.buttons {
    display: flex;

    gap: 9px;

    margin-top: 17px;
}


.map-button {
    flex: 1;

    padding: 10px 7px;

    text-align: center;

    text-decoration: none;

    border-radius: 11px;

    font-size: 12px;

    font-weight: 600;
}


.google {
    background: #f4f4f4;
    color: #4b4b4b;
}


.naver {
    background: #e8f7ed;
    color: #168b3c;
}

.amap {
    background: #edf3ff;
    color: #2f63c7;
}


/* ===== 目录展开 / 收起 ===== */
.menu-toggle {
    display: none;
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 3100;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 13px;
    background: rgba(255,255,255,.96);
    color: #c64e7e;
    font-size: 21px;
    box-shadow: 0 4px 16px rgba(120,70,90,.14);
    cursor: pointer;
}

.sidebar-close {
    display: block;
    position: absolute;
    top: 14px;
    right: 14px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 10px;
    background: #fff0f5;
    color: #c64e7e;
    font-size: 22px;
    cursor: pointer;
}

.sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(70,45,55,.22);
    z-index: 2900;
}

/* 电脑端：默认展开，但可以收起 */
body.sidebar-collapsed .sidebar {
    transform: translateX(-100%);
    box-shadow: none;
}

body.sidebar-collapsed #map {
    left: 0;
    width: 100%;
}

body.sidebar-collapsed .menu-toggle {
    display: block;
}

.sidebar {
    transition: transform .28s ease, box-shadow .28s ease;
}

#map {
    transition: left .28s ease, width .28s ease;
}

/* ===== 手机 ===== */
@media (max-width: 700px) {

    .sidebar {
        width: 285px;
        transform: translateX(-100%);
        padding: 55px 18px 25px;
        box-shadow: none;
        z-index: 3000;
    }

    .sidebar.open {
        transform: translateX(0);
        box-shadow: 8px 0 30px rgba(70,40,55,.12);
    }

    .menu-toggle {
        display: block;
    }

    .sidebar-overlay.open {
        display: block;
    }

    #map {
        left: 0;
        width: 100%;
    }

    .logo {
        font-size: 22px;
    }

    .city-button {
        font-size: 13px;
    }

    .type-button {
        font-size: 12px;
    }

    .map-watermark {
        right: 10px;
        bottom: 12px;
        font-size: 10px;
    }

    .popup {
        width: min(285px, 72vw);
    }
}

/* ===== 想去 / 路线规划 ===== */

.want-btn{
    width:100%;
    margin-top:10px;
    border:none;
    border-radius:10px;
    padding:9px 10px;
    background:#fff0f5;
    color:#c65d86;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
}

.want-btn.selected{
    background:#e88cad;
    color:#fff;
}

.route-launch{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:2200;
    border:none;
    border-radius:14px;
    padding:11px 14px;
    background:#fff;
    color:#c55f87;
    font-weight:800;
    box-shadow:0 5px 18px rgba(100,50,70,.15);
    cursor:pointer;
}

.route-panel{
    position:fixed;
    right:18px;
    bottom:64px;
    z-index:2200;
    width:330px;
    max-height:62vh;
    overflow:auto;
    background:rgba(255,255,255,.97);
    border:1px solid #f0dce5;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(100,50,70,.16);
    padding:16px;
    display:none;
}

.route-panel.show{
    display:block;
}

.route-title{
    font-size:15px;
    font-weight:800;
    color:#5a434c;
    margin-bottom:4px;
}

.route-sub{
    font-size:11px;
    line-height:1.5;
    color:#a58994;
    margin-bottom:12px;
}

.route-selected{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-bottom:12px;
}

.route-chip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 10px;
    background:#fff7fa;
    border-radius:10px;
    font-size:12px;
    color:#6d5660;
}

.route-remove{
    border:none;
    background:transparent;
    color:#c9809d;
    cursor:pointer;
    font-size:15px;
}

.route-actions{
    display:flex;
    gap:8px;
}

.route-action{
    flex:1;
    border:none;
    border-radius:11px;
    padding:10px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
}

.route-plan{
    background:#df6f9c;
    color:#fff;
}

.route-clear{
    background:#f4edf0;
    color:#946c7c;
}

.route-result{
    display:none;
    margin-top:13px;
    padding-top:12px;
    border-top:1px solid #f0dce5;
}

.route-result.show{
    display:block;
}

.route-step{
    padding:8px 10px;
    margin-bottom:7px;
    border-radius:10px;
    background:#fff8fb;
    font-size:12px;
    color:#5f4952;
}

.route-map-links{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.route-link{
    flex:1;
    text-align:center;
    text-decoration:none;
    border-radius:11px;
    padding:10px 8px;
    font-size:12px;
    font-weight:700;
}

.route-google{
    background:#f2f2f2;
    color:#444;
}

.route-naver{
    background:#e8f7ed;
    color:#168b3c;
}

.route-note{
    margin-top:9px;
    font-size:10px;
    line-height:1.5;
    color:#aa919a;
}

@media (max-width:700px){
    .route-panel{
        left:12px;
        right:12px;
        bottom:68px;
        width:auto;
        max-height:58vh;
    }

    .route-launch{
        right:12px;
        bottom:12px;
    }
}


/* ===== 搜索 ===== */
.search-box{
    margin:0 0 14px;
}
.search-input{
    width:100%;
    border:1px solid #efd6e1;
    border-radius:11px;
    padding:10px 11px;
    font:inherit;
    font-size:12px;
    color:#5d4650;
    background:#fffafd;
    outline:none;
}
.search-input:focus{
    border-color:#e48bae;
    box-shadow:0 0 0 3px rgba(228,139,174,.10);
}
.search-results{
    margin-top:6px;
    display:none;
    background:#fff;
    border:1px solid #f0dce5;
    border-radius:11px;
    overflow:hidden;
}
.search-results.show{
    display:block;
}
.search-result{
    width:100%;
    border:none;
    background:#fff;
    text-align:left;
    padding:9px 10px;
    color:#755966;
    font-size:12px;
    cursor:pointer;
}
.search-result:hover{
    background:#fff5f8;
    color:#d9578c;
}

/* ===== 附近同款 ===== */
.nearby-box{
    margin-top:12px;
    padding:10px 11px;
    background:#fff8fb;
    border-radius:11px;
}
.nearby-title{
    font-size:11px;
    font-weight:800;
    color:#a56d83;
    margin-bottom:5px;
}
.nearby-link{
    display:block;
    width:100%;
    border:none;
    background:transparent;
    text-align:left;
    padding:4px 0;
    color:#8d6a78;
    font-size:11px;
    cursor:pointer;
}
.nearby-link:hover{
    color:#d9578c;
}

/* ===== 路线手动排序 ===== */
.route-chip-controls{
    display:flex;
    align-items:center;
    gap:3px;
}
.route-move{
    width:24px;
    height:24px;
    border:none;
    border-radius:7px;
    background:#f4e9ee;
    color:#9a677a;
    cursor:pointer;
    font-size:11px;
    padding:0;
}
.route-move:disabled{
    opacity:.3;
    cursor:default;
}
.route-hint{
    font-size:10px;
    color:#ad929d;
    line-height:1.5;
    margin:-4px 0 10px;
}

</style>

</head>

/* ===== 附近同款 ===== */

function haversineKm(a,b){

    const R = 6371;
    const toRad = d => d * Math.PI / 180;

    const dLat =
    toRad(b.lat - a.lat);

    const dLng =
    toRad(b.lng - a.lng);

    const lat1 =
    toRad(a.lat);

    const lat2 =
    toRad(b.lat);

    const x =
    Math.sin(dLat/2) ** 2 +
    Math.cos(lat1) *
    Math.cos(lat2) *
    Math.sin(dLng/2) ** 2;

    return 2 * R *
    Math.asin(Math.sqrt(x));
}

function buildNearbyHTML(spot){

    const nearby =
    spots
    .map((candidate,index) => ({
        candidate,
        index,
        distance:
        candidate === spot
        ? Infinity
        : haversineKm(spot,candidate)
    }))
    .filter(item =>
        item.distance <= 1.0
    )
    .sort((a,b) =>
        a.distance - b.distance
    )
    .slice(0,3);

    if(!nearby.length){
        return "";
    }

    return `
    <div class="nearby-box">
        <div class="nearby-title">
        附近同款
        </div>

        ${nearby.map(item => `
            <button
            class="nearby-link"
            data-nearby-index="${item.index}"
            >
            🐱 ${item.candidate.name}
            · ${Math.round(item.distance*1000)}m
            </button>
        `).join("")}
    </div>
    `;
}

}


/* ===== 显示地点 ===== */

function showSpots(
    city = "Seoul",
    type = "all"
) {

    markers.forEach(
        marker =>
        map.removeLayer(marker)
    );

    markers = [];


    const filtered =
    spots.filter(spot => {

        const cityMatch =
        spot.city === city;

        const typeMatch =
        type === "all" ||
        spot.type === type;

        return cityMatch &&
               typeMatch;

    });


    filtered.forEach(spot => {

        const marker =
        createMarker(spot);

        marker.addTo(map);

        markers.push(marker);

    });


    if (filtered.length > 0) {

        map.fitBounds(
            L.latLngBounds(
                filtered.map(
                    spot =>
                    [spot.lat, spot.lng]
                )
            ),
            {
                padding: [80, 80]
            }
        );

    } else {

        map.setView(
            cityCenters[city],
            13
        );

    }
}

function geoDistance(a,b){
    const dx = a.lat - b.lat;
    const dy = a.lng - b.lng;
    return Math.sqrt(dx*dx + dy*dy);
}

function optimizeOrder(indexes){

    if(indexes.length <= 2){
        return [...indexes];
    }

    let bestOrder = null;
    let bestTotal = Infinity;

    indexes.forEach(start => {

        const remaining = new Set(indexes);
        remaining.delete(start);

        const order = [start];
        let current = start;
        let total = 0;

        while(remaining.size > 0){

            let next = null;
            let nextDistance = Infinity;

            remaining.forEach(i => {

                const d = geoDistance(
                    spots[current],
                    spots[i]
                );

                if(d < nextDistance){
                    nextDistance = d;
                    next = i;
                }
            });

            total += nextDistance;
            order.push(next);
            remaining.delete(next);
            current = next;
        }

        if(total < bestTotal){
            bestTotal = total;
            bestOrder = order;
        }
    });

    return bestOrder;
}

function buildGoogleRoute(order){

    if(order.length < 2){
        return "#";
    }

    const routeLabel =
    spot =>
    spot.routeAddress ||
    spot.address ||
    spot.name;

    const origin =
    encodeURIComponent(
        routeLabel(spots[order[0]])
    );

    const destination =
    encodeURIComponent(
        routeLabel(
            spots[order[order.length-1]]
        )
    );

    const middle =
    order
    .slice(1,-1)
    .map(index =>
        routeLabel(spots[index])
    );

    let url =
    `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&travelmode=transit`;

    if(middle.length > 0){
        url +=
        "&waypoints=" +
        encodeURIComponent(
            middle.join("|")
        );
    }

    return url;
}


function buildNaverTransitRoute(order){

    if(order.length < 2){
        return "#";
    }

    const start = spots[order[0]];
    const end = spots[order[1]];

    function placeToken(spot){
        const raw =
            `${spot.lng},${spot.lat},${spot.name},${spot.naverPin || ""},PLACE_POI`;
        return encodeURIComponent(raw);
    }

    return (
        "https://way-m.map.naver.com/quick-path/" +
        placeToken(start) + "/" +
        placeToken(end) +
        "/-/transit/0"
    );
}


function planSelectedRoute(){

    const indexes =
    [...selectedSpotIndexes];

    if(indexes.length < 2){
        alert("至少选择 2 个地点才能规划路线。");
        return;
    }

    const order =
    optimizeOrder(indexes);

    manualRouteOrder =
    [...order];

    updateRouteUI();

    renderRouteResult(
        manualRouteOrder
    );
}

function renderRouteResult(order){

    routeOrder.innerHTML = "";

    order.forEach((index, i) => {

        const step =
        document.createElement("div");

        step.className =
        "route-step";

        step.textContent =
        `${i+1}. ${spots[index].name}`;

        routeOrder.appendChild(step);
    });

    googleRoute.href =
    buildGoogleRoute(order);

    const routeCities =
    [...new Set(
        order.map(index => spots[index].city)
    )];

    if(
        routeCities.length === 1 &&
        routeCities[0] === "Hong Kong"
    ){
        naverNext.textContent =
        "🔵 高德地图";

        naverNext.classList.remove(
            "route-naver"
        );

        naverNext.classList.add(
            "route-google"
        );

        const secondSpot =
        spots[order[1]];

        naverNext.href =
        secondSpot.amap ||
        secondSpot.google ||
        "#";
    }else{
        naverNext.textContent =
        "🟢 Naver Map";

        naverNext.classList.remove(
            "route-google"
        );

        naverNext.classList.add(
            "route-naver"
        );

        naverNext.href =
        buildNaverTransitRoute(order);
    }

    routeResult.classList.add("show");
}

document.addEventListener(
    "click",
    event => {

        const want =
        event.target.closest(
            "[data-want-index]"
        );

        if(want){

            const index =
            Number(
                want.dataset.wantIndex
            );

            if(selectedSpotIndexes.has(index)){
                selectedSpotIndexes.delete(index);
                manualRouteOrder =
                manualRouteOrder.filter(
                    i => i !== index
                );
                want.textContent = "♡ 添加到想去";
                want.classList.remove("selected");
            }else{
                selectedSpotIndexes.add(index);
                if(!manualRouteOrder.includes(index)){
                    manualRouteOrder.push(index);
                }
                want.textContent = "✓ 已添加到想去";
                want.classList.add("selected");
            }

            routeResult.classList.remove("show");
            updateRouteUI();
            return;
        }

        const remove =
        event.target.closest(
            "[data-remove-index]"
        );

        if(remove){
            const index =
            Number(remove.dataset.removeIndex);

            selectedSpotIndexes.delete(index);

            manualRouteOrder =
            manualRouteOrder.filter(
                i => i !== index
            );

            routeResult.classList.remove("show");
            updateRouteUI();
            return;
        }

        const move =
        event.target.closest(
            "[data-move-index]"
        );

        if(move){

            const pos =
            Number(move.dataset.moveIndex);

            const dir =
            Number(move.dataset.moveDir);

            const next =
            pos + dir;

            if(
                next >= 0 &&
                next < manualRouteOrder.length
            ){
                [
                    manualRouteOrder[pos],
                    manualRouteOrder[next]
                ] = [
                    manualRouteOrder[next],
                    manualRouteOrder[pos]
                ];

                updateRouteUI();

                if(manualRouteOrder.length >= 2){
                    renderRouteResult(
                        manualRouteOrder
                    );
                }
            }

            return;
        }

        const nearby =
        event.target.closest(
            "[data-nearby-index]"
        );

        if(nearby){

            const index =
            Number(
                nearby.dataset.nearbyIndex
            );

            const spot =
            spots[index];

            map.setView(
                [spot.lat,spot.lng],
                17
            );

            markers.forEach(marker => {
                const p = marker.getLatLng();

                if(
                    Math.abs(p.lat-spot.lat) < 0.00001 &&
                    Math.abs(p.lng-spot.lng) < 0.00001
                ){
                    marker.openPopup();
                }
            });

            return;
        }
    }
);

routeLaunch.addEventListener(
    "click",
    () => {
        routePanel.classList.toggle("show");
    }
);

routePlan.addEventListener(
    "click",
    planSelectedRoute
);

routeClear.addEventListener(
    "click",
    () => {
        selectedSpotIndexes.clear();
        manualRouteOrder = [];
        routeResult.classList.remove("show");
        updateRouteUI();
    }
);

updateRouteUI();




/* ===== 搜索地点 ===== */

const spotSearch =
document.getElementById("spotSearch");

const searchResults =
document.getElementById("searchResults");

function openSpotByIndex(index){

    const spot =
    spots[index];

    showSpots(
        spot.city,
        "all"
    );

    map.setView(
        [spot.lat,spot.lng],
        17
    );

    setTimeout(() => {

        markers.forEach(marker => {

            const p =
            marker.getLatLng();

            if(
                Math.abs(p.lat-spot.lat) < 0.00001 &&
                Math.abs(p.lng-spot.lng) < 0.00001
            ){
                marker.openPopup();
            }
        });

    },80);
}

spotSearch.addEventListener(
    "input",
    () => {

        const q =
        spotSearch.value
        .trim()
        .toLowerCase();

        searchResults.innerHTML = "";

        if(!q){
            searchResults.classList.remove("show");
            return;
        }

        const matched =
        spots
        .map((spot,index) => ({
            spot,index
        }))
        .filter(item => {

            const text =
            [
                item.spot.name,
                item.spot.subtitle || "",
                item.spot.address || ""
            ]
            .join(" ")
            .toLowerCase();

            return text.includes(q);
        })
        .slice(0,8);

        if(!matched.length){
            searchResults.innerHTML =
            '<div style="padding:9px 10px;font-size:11px;color:#ad929d;">没有找到地点</div>';
            searchResults.classList.add("show");
            return;
        }

        matched.forEach(item => {

            const btn =
            document.createElement("button");

            btn.className =
            "search-result";

            btn.textContent =
            `🐱 ${item.spot.name}`;

            btn.addEventListener(
                "click",
                () => {

                    openSpotByIndex(
                        item.index
                    );

                    spotSearch.value = "";
                    searchResults.classList.remove("show");

                    if(window.innerWidth <= 700){
                        closeSidebar();
                    }
                }
            );

            searchResults.appendChild(btn);
        });

        searchResults.classList.add("show");
    }
);



/* ===== 全设备目录控制 ===== */
const sidebar = document.getElementById("sidebar");
const menuToggle = document.getElementById("menuToggle");
const sidebarClose = document.getElementById("sidebarClose");
const sidebarOverlay = document.getElementById("sidebarOverlay");

function isMobile() {
    return window.innerWidth <= 700;
}

function openSidebar() {
    if (isMobile()) {
        sidebar.classList.add("open");
        sidebarOverlay.classList.add("open");
    } else {
        document.body.classList.remove("sidebar-collapsed");
    }
    setTimeout(() => map.invalidateSize(), 300);
}

function closeSidebar() {
    if (isMobile()) {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("open");
    } else {
        document.body.classList.add("sidebar-collapsed");
    }
    setTimeout(() => map.invalidateSize(), 300);
}

menuToggle.addEventListener("click", openSidebar);
sidebarClose.addEventListener("click", closeSidebar);
sidebarOverlay.addEventListener("click", closeSidebar);

function applyResponsiveSidebar() {
    if (isMobile()) {
        document.body.classList.remove("sidebar-collapsed");
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("open");
    } else {
        sidebar.classList.remove("open");
        sidebarOverlay.classList.remove("open");
    }
    setTimeout(() => map.invalidateSize(), 200);
}

window.addEventListener("resize", applyResponsiveSidebar);
applyResponsiveSidebar();
</script>
